name: Java CI/CD with Maven & Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ===== Job 1: Build & Test =====
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build and Test with Maven
      run: mvn clean test

  # ===== Job 2: Build & Push Docker Image =====
  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: johnpham666
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          johnpham666/datetimechecker:latest
          johnpham666/datetimechecker:${{ github.sha }}

  # ===== Job 3: Android Mobile UI Testing =====
  android-mobile-testing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Run Espresso Tests via Robolectric
      working-directory: ./android-app
      run: gradle test

  # ===== Job 4: Web E2E, API & Performance Testing =====
  integration-and-performance-testing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up k6
      uses: grafana/setup-k6-action@v1

    - name: Start Spring Boot Server in Background
      run: |
        mvn spring-boot:run &
        while ! curl -s http://localhost:8080/api/v1/check?day=1\&month=1\&year=2024 > /dev/null; do
          echo "Waiting for Spring Boot to start..."
          sleep 3
        done
        echo "Spring Boot is UP!"

    - name: Install Playwright & Dependencies
      working-directory: ./e2e-tests
      run: |
        npm ci
        npx playwright install --with-deps

    - name: Run Web E2E & API Tests (Playwright)
      working-directory: ./e2e-tests
      run: npx playwright test

    - name: Run Performance Test (k6)
      run: k6 run performance_test.js
